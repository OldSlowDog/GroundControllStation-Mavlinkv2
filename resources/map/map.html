<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>GCS Map</title>
    <link rel="stylesheet" href="map.css" />

    <!-- Leaflet.js 开源地图库（无需 API Key，完全免费） -->
    <!-- 文档: https://leafletjs.com/ -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <!-- Qt WebChannel（Python ↔ JavaScript 双向通信桥） -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <!-- 主地图容器 -->
    <div id="map"></div>

    <!-- 左上：GPS/无人机信息面板 -->
    <div id="gps-panel" class="info-panel hidden">
        <div class="panel-title">📍 GPS / Drone</div>
        <div class="panel-row"><span class="label">Fix:</span><span id="gps-fix">—</span></div>
        <div class="panel-row"><span class="label">Sats:</span><span id="gps-sats">—</span></div>
        <div class="panel-row"><span class="label">Lat:</span><span id="gps-lat">—</span></div>
        <div class="panel-row"><span class="label">Lng:</span><span id="gps-lng">—</span></div>
        <div class="panel-row"><span class="label">Alt:</span><span id="gps-alt">—</span></div>
        <div class="panel-row"><span class="label">Spd:</span><span id="gps-speed">—</span></div>
        <div class="panel-row"><span class="label">HDG:</span><span id="gps-hdg">—</span></div>
    </div>

    <!-- 右上：地点搜索框 -->
    <div id="search-box" class="search-box">
        <input
            type="text"
            id="search-input"
            placeholder="🔍 搜索地点（Nominatim / 免费）"
        />
        <button id="search-btn">搜索</button>
        <div id="search-results" class="search-results hidden"></div>
    </div>

    <!-- 状态提示条（底部浮动） -->
    <div id="toast" class="toast hidden"></div>

    <!-- 业务脚本：Leaflet 实现 + Qt WebChannel 桥 -->
    <script src="map.js"></script>
</body>
</html>
